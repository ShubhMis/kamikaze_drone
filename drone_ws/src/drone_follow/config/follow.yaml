# Run and controller knobs. Camera resolution/extrinsics remain in the model SDF.
baseline:
  px4_dir: ~/PX4-Autopilot
  ros_domain_id: 42
  agent_port: 8888
  ready_timeout_s: 90.0
  stale_timeout_s: 3.0
  takeoff_altitude_m: 4.0
  # Target begins the airborne scenario this much higher than the follower.
  # PX4 takeoff altitude is relative to each vehicle's home; 3.0 + 3.0 = 6.0 m.
  target_takeoff_altitude_offset_m: 2.0
  follower_yaw_deg: 12.0  # initial scene heading offset for pursuit evaluation
  flight_timeout_s: 90.0
  scenario: observe  # observe, hover, intercept
  duration_s: 0.0    # 0 = continue until you press Ctrl+C
  auto_land: false  # no scheduled landing; PX4's own failsafes remain active
  keep_open: true   # report completion/failure without shutting down the simulation
  record: false     # opt in with --record for CSV, images, source snapshots and ULogs
  headless: false
  viewer: true       # camera window; --headless disables it unless --viewer is given
  viewer_fps: 60.0   # 3 refresh slots per 20 Hz camera frame; no invented measurements
  viewer_stale_s: 0.5  # freeze warning after this many wall seconds without a frame
  viewer_pair_wait_s: 0.08  # max age of a buffered image/detection pair, wall seconds
detector:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /follow_camera/image
    info_topic: /follow_camera/camera_info
    max_image_age_s: 0.2
    min_marker_pixels: 12
follower:
  ros__parameters:
    use_sim_time: true
    px4_namespace: /px4_1
    # The active package has one controller; there is no mode selector.
    max_measurement_age_s: 0.3
    minimum_detections: 6
    # After a vision-only loss, hold zero velocity and automatically create a
    # fresh controller state once this many detections have been rebuilt.
    auto_reacquire: true
    reacquire_timeout_s: 5.0
    # Own-state samples are retained in ROS simulation time and interpolated at
    # each image exposure timestamp. Extrapolation is intentionally small.
    state_history_s: 2.0
    max_state_extrapolation_s: 0.03
    max_odometry_sample_age_s: 0.1
    # Literal bounded interpretation of Eq. (14): vd = ||vnow|| + ka.
    # Here ka is explicitly treated as a speed increment in m/s.
    speed_increment_mps: 1.0
    png_gain_y: 3.0
    png_gain_z: 3.0
    fov_kp: 0.03
    fov_kd: 0.01
    max_speed: 4.0
    max_yaw_rate: 0.3
    max_vertical_speed: 2.0
    camera_mount_q: [1.0, 0.0, 0.0, 0.0]
leader:
  ros__parameters:
    use_sim_time: true
    px4_namespace: /px4_2
