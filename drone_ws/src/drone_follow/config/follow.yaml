# Run and controller knobs. Camera resolution/extrinsics remain in the model SDF.
baseline:
  px4_dir: ~/PX4-Autopilot
  ros_domain_id: 42
  agent_port: 8888
  ready_timeout_s: 90.0
  stale_timeout_s: 3.0
  takeoff_altitude_m: 3.0
  follower_yaw_deg: 12.0  # initial scene heading offset; try 10.0 for centring
  flight_timeout_s: 90.0
  scenario: observe  # observe, hover, centre; no forward approach or range estimate
  duration_s: 0.0    # 0 = continue until you press Ctrl+C
  auto_land: false  # no scheduled landing; PX4's own failsafes remain active
  keep_open: true   # report completion/failure without shutting down the simulation
  record: false     # opt in with --record for CSV, images, source snapshots and ULogs
  headless: false
  viewer: true       # camera window; --headless disables it unless --viewer is given
  viewer_fps: 60.0   # 3 refresh slots per 20 Hz camera frame; no invented measurements
  viewer_stale_s: 0.5  # freeze warning after this many wall seconds without a frame
  viewer_pair_wait_s: 0.08  # max age of a buffered image/detection pair, wall seconds
detector:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /follow_camera/image
    info_topic: /follow_camera/camera_info
    max_image_age_s: 0.2
    min_marker_pixels: 12
follower:
  ros__parameters:
    use_sim_time: true
    px4_namespace: /px4_1
    # ── Mode ────────────────────────────────────────────────────────────────
    # 'centre'    → original yaw+vertical centring only (zero forward velocity)
    # 'intercept' → PNG-IBVS from arXiv:2409.17497v2 (full 3D NED velocity)
    mode: "intercept"
    # ── Centre mode parameters ───────────────────────────────────────────────
    yaw_gain: 0.8              # rad/s per rad of horizontal bearing error
    vertical_gain: 0.6         # m/s per normalized vertical error, level hover
    max_yaw_rate: 0.3          # rad/s
    max_vertical_speed: 0.4    # m/s; horizontal velocity is always zero
    # ── Shared detection gating ──────────────────────────────────────────────
    max_measurement_age_s: 0.3
    minimum_detections: 6
    # ── Intercept mode parameters (arXiv:2409.17497v2, Yan et al. 2025) ─────
    approach_speed: 3.0            # v_d  — desired closing speed (m/s)
    png_gain_y: 3.0                # K_y  — PNG gain, vertical plane   (paper: 3)
    png_gain_z: 3.0                # K_z  — PNG gain, horizontal plane (paper: 3)
    fov_kp: 0.03                   # yaw PD proportional gain          (paper: 0.03)
    fov_kd: 0.01                   # yaw PD derivative gain            (paper: 0.01)
    fov_ka: 2.0                    # vertical FOV correction gain      (paper: 2)
    max_speed: 4.0                 # hard 3D velocity magnitude limit (m/s)
    max_vertical_speed_intercept: 2.0  # NED-down hard clamp (m/s)
    camera_mount_q: [1.0, 0.0, 0.0, 0.0]  # identity = camera aligned with body FRD
leader:
  ros__parameters:
    use_sim_time: true
    px4_namespace: /px4_2
